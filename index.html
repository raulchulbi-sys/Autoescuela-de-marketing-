let historyStack=[];
function save(){
localStorage.setItem('md_stats',JSON.stringify(stats));
localStorage.setItem('md_missStats',JSON.stringify(missStats));
}
function sh(a){return [...a].sort(()=>Math.random()-0.5)}
function progress(){return `<div class="bar"><div class="fill" style="width:${Math.round((i)/pool.length*100)}%"></div></div>`;}
function startPractice(){mode='practice';pool=sh(questions);i=0;historyStack=[];show();}
function startExam(){
mode='exam';
pool=sh(questions).slice(0,Math.min(40,questions.length));
i=0;score=0;wrong=[];historyStack=[];t0=Date.now();
timeLeft=1500;
if(timerInterval) clearInterval(timerInterval);
timerInterval=setInterval(updateTimer,1000);
show();
}
function show(){
 let q=pool[i];
 let h=`<p><b>Pregunta ${i+1}/${pool.length}</b></p>`;
if(mode==='exam'){
 const m=Math.floor(timeLeft/60);
 const s=timeLeft%60;
 h+=`<p id="timer">⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</p>`;
}
h+=`${progress()}`+(q.img?`<img src="${q.img}" style="max-width:220px;margin:10px 0;display:block">`:``)+`<h3>${q.q}</h3>`;
 q.o.forEach((o,n)=>h+=`<button class="opt" onclick="answer(${n})">${o}</button>`);

 document.getElementById('app').innerHTML=h;
}

function answer(n){

 let q = pool[i];

 const botones = document.querySelectorAll('.opt');

 botones.forEach((btn,index)=>{

   btn.disabled = true;

   if(index === q.a){
      btn.style.backgroundColor = "#4CAF50";
      btn.style.color = "white";
   }

   if(index === n && index !== q.a){
      btn.style.backgroundColor = "#F44336";
      btn.style.color = "white";
   }

 });

 if(mode === 'practice'){

   if(n === q.a){
      stats.ok++;
      if(mode==='hard'){ delete missStats[q.q]; }
   } else {
      stats.bad++;
      missStats[q.q]=(missStats[q.q]||0)+1;
   }

   save();

   document.getElementById('app').innerHTML +=
   `<div style="display:flex;gap:10px;margin-top:12px">
      <button onclick="prevQ()" ${historyStack.length?'':'disabled'}>⬅️ Anterior</button>
      <button onclick="nextQ()">➡️ Siguiente</button>
    </div>`;

 } else {

   if(n === q.a){
      score++;
      stats.ok++;
   } else {
      stats.bad++;
      wrong.push(q);
   }

   save();

   setTimeout(() => {
      nextQ();
   }, 1000);

 }
}

function nextQ(){
 historyStack.push(i);
 i++;
 if(i>=pool.length){
   if(mode==='exam'){
      clearInterval(timerInterval);
      finishExam();
      return;
   }
   if(mode==='hard'){
      document.getElementById('app').innerHTML='<h2>🔥 Repaso completado</h2><p>Preguntas pendientes: '+Object.keys(missStats).length+'</p><button onclick="startHardMode()">🔥 Más falladas</button><button onclick="location.reload()">🏠 Inicio</button>';
      save();
      return;
   }
   pool=sh(questions);i=0;
 }
 show();
}
function prevQ(){
 if(!historyStack.length) return;
 i=historyStack.pop();
 show();
}
function retryWrong(){ if(!wrong.length)return; pool=wrong;i=0;mode='practice';show(); }


function updateTimer(){
  timeLeft--;
  const el=document.getElementById('timer');
  if(el){
    const m=Math.floor(timeLeft/60);
    const s=timeLeft%60;
    el.textContent='⏱️ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  if(timeLeft<=0){
    clearInterval(timerInterval);
    finishExam();
  }
}

function finishExam(){
  let s=Math.round((Date.now()-t0)/1000);
  let pct=Math.round(score*100/pool.length);
if(!bestScore || pct>bestScore.pct){
  bestScore={score:score,total:pool.length,pct:pct,date:new Date().toLocaleString()};
  localStorage.setItem('md_best',JSON.stringify(bestScore));
}
examHistory.unshift({score:score,total:pool.length,pct:pct,date:new Date().toLocaleString()});
examHistory=examHistory.slice(0,20);
localStorage.setItem('md_history',JSON.stringify(examHistory));
  document.getElementById('app').innerHTML=`<h2>⏰ Tiempo agotado / Examen finalizado</h2>
  <h1>${score}/${pool.length}</h1>
  <h3>${pct}%</h3>
  <p>⏱️ ${s} s</p>
  <button onclick="retryWrong()">🔄 Repasar falladas (${wrong.length})</button>
  <button onclick="location.reload()">🏠 Inicio</button>`;
}


function startHardMode(){
 const hardQuestions=[...new Map(questions.filter(q=>missStats[q.q]).map(q=>[q.q,q])).values()];
 if(!hardQuestions.length){
   document.getElementById('app').innerHTML='<h2>🔥 Más falladas</h2><p>Todavía no has fallado ninguna pregunta.</p><button onclick="location.reload()">🏠 Inicio</button>';
   return;
 }
 mode='hard';
 pool=hardQuestions;
 i=0;
 historyStack=[];
 show();
}

function statsView(){
 let t=stats.ok+stats.bad,p=t?Math.round(stats.ok*100/t):0;
 document.getElementById('app').innerHTML=`<h2>📊 Estadísticas</h2>
 <p>Preguntas cargadas: 153</p>
 <p>Aciertos: ${stats.ok}</p>
 <p>Fallos: ${stats.bad}</p>
 <p>Porcentaje: ${p}%</p><p>🔥 Más falladas: ${Object.keys(missStats).length}</p>
 ${bestScore?`<h3>🏆 Mejor nota</h3><p>${bestScore.score}/${bestScore.total} (${bestScore.pct}%)<br>${bestScore.date}</p>`:''}
 <h3>📈 Últimos exámenes</h3>
 <div>${examHistory.slice(0,10).map(e=>`<div>${e.score}/${e.total} (${e.pct}%) - ${e.date}</div>`).join('')}</div>
 <button onclick="resetStats()">🗑️ Reiniciar estadísticas</button>
 <button onclick="location.reload()">🏠 Volver al inicio</button>`;
}
function resetStats(){
 if(confirm('¿Seguro que quieres borrar todas las estadísticas?')){
   const darkPref = localStorage.getItem('md_darkMode');
   localStorage.clear();
   if(darkPref!==null) localStorage.setItem('md_darkMode', darkPref);
   stats={ok:0,bad:0};
   missStats={};
   bestScore=null;
   examHistory=[];
   location.reload();
 }
}

</script>
<div id="signature">© 2026 · Creado por Hernardo Bernardo</div>
<style>
#signature{
  position: fixed;
  bottom: 8px;
  right: 12px;
  font-size: 11px;
  color: #888;
  opacity: 0.7;
  user-select: none;
}
</style>

<button id="themeToggle" onclick="toggleTheme()">🌙</button>

<style>
#themeToggle{
position:fixed;
bottom:15px;
left:15px;
width:50px;
height:50px;
border-radius:50%;
font-size:22px;
z-index:9999;
}
.dark-mode{background:#121212!important;color:#f5f5f5!important;}
.dark-mode .card{background:#1e1e1e!important;color:#f5f5f5!important;}
.dark-mode button:not([style*="background-color"]){background:#333!important;color:#fff!important;}
</style>

<script>
let darkMode=localStorage.getItem('md_darkMode')==='1';

function applyTheme(){
 const btn=document.getElementById('themeToggle');
 if(darkMode){
   document.body.classList.add('dark-mode');
   if(btn) btn.innerHTML='☀️';
 }else{
   document.body.classList.remove('dark-mode');
   if(btn) btn.innerHTML='🌙';
 }
}

function toggleTheme(){
 darkMode=!darkMode;
 localStorage.setItem('md_darkMode',darkMode?'1':'0');
 applyTheme();
}

window.addEventListener('load',applyTheme);
</script>
