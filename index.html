<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autoescuela Marketing Deportivo V4</title>
<style>
:root{
  --bg1:#eef2ff;--bg2:#f8fafc;
  --surface:#ffffff;--surface-2:#f1f5f9;--surface-3:#e7edf6;
  --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --accent:#6366f1;--accent-2:#8b5cf6;--accent-weak:#eef2ff;
  --success:#16a34a;--success-weak:#dcfce7;
  --danger:#dc2626;--danger-weak:#fee2e2;
  --warn:#f59e0b;
  --shadow:0 10px 30px -12px rgba(30,41,59,.28);
  --radius:18px;--radius-sm:12px;
}
body.dark-mode{
  --bg1:#10172e;--bg2:#0b1020;
  --surface:#161f33;--surface-2:#1e293b;--surface-3:#27344c;
  --text:#e6edff;--muted:#94a3b8;--border:#2c3a52;
  --accent:#818cf8;--accent-2:#a78bfa;--accent-weak:#1e293b;
  --success:#4ade80;--success-weak:#16321f;
  --danger:#f87171;--danger-weak:#3a1c1c;
  --warn:#fbbf24;
  --shadow:0 16px 44px -18px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  margin:0;color:var(--text);line-height:1.5;min-height:100vh;
  background:radial-gradient(1100px 560px at 85% -8%,var(--bg1),transparent),var(--bg2);
  background-attachment:fixed;transition:background .3s,color .3s;
}
.wrap{max-width:880px;margin:0 auto;padding:clamp(12px,3vw,32px)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(16px,3.5vw,32px);box-shadow:var(--shadow)}
.app-header{margin-bottom:22px}
.app-header h1{margin:0;font-size:clamp(20px,4.6vw,30px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:14px;font-weight:500}
button{font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:var(--radius-sm);padding:12px 16px;cursor:pointer;color:var(--text);background:var(--surface-2);transition:transform .08s,box-shadow .2s,background .2s,border-color .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
#menu button{background:var(--surface-2);border:1px solid var(--border);padding:14px 14px;text-align:left}
#menu button:hover{border-color:var(--accent);background:var(--accent-weak)}
#app{margin-top:20px}
#app>*{margin-bottom:16px}
#app h2{font-size:clamp(18px,3.6vw,24px);font-weight:800;margin:0 0 14px;letter-spacing:-.01em}
#app h3{font-size:17px;font-weight:700;margin:18px 0 10px}
#app img{max-width:100%;height:auto;border-radius:12px;display:block}
.bar{height:10px;background:var(--surface-3);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s ease;border-radius:999px}
.q-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.q-count{font-weight:700;color:var(--muted);font-size:14px}
.question{font-size:clamp(16px,3vw,20px);font-weight:700;line-height:1.4}
.opt{display:block;width:100%;margin:10px 0;text-align:left;background:var(--surface-2);border:1.5px solid var(--border);padding:15px 16px;border-radius:14px;font-weight:600;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-weak)}
.opt.selected{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.opt.correct{background:var(--success-weak);border-color:var(--success)}
.opt.wrong{background:var(--danger-weak);border-color:var(--danger)}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--accent-weak);color:var(--accent);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:15px}
.timer.danger{background:var(--danger-weak);color:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin-bottom:10px}
.cell{aspect-ratio:1/1;min-width:0;padding:0;border-radius:10px;font-size:14px;font-weight:700;background:var(--surface-2);border:1.5px solid var(--border);color:var(--muted)}
.cell.answered{background:var(--success);border-color:var(--success);color:#fff}
.cell.flagged{background:var(--warn);border-color:var(--warn);color:#fff}
.cell.current{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border)}
.match-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0}
.match-row>div{flex:1}
select{flex:1;font-family:inherit;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text)}
select.sel-ok{border-color:var(--success);background:var(--success-weak)}
select.sel-bad{border-color:var(--danger);background:var(--danger-weak)}
.result{text-align:center}
.result .emoji{font-size:64px;margin:0;line-height:1}
.result .score{font-size:40px;font-weight:900;margin:6px 0;letter-spacing:-.02em}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat .n{font-size:22px;font-weight:800;display:block}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.review-item{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px}
.review-item b{display:block;margin-bottom:8px}
.user-ans{color:var(--danger);font-weight:600}
.correct-ans{color:var(--success);font-weight:600}
.exam-row{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.exam-row .date{font-size:12px;color:var(--muted)}
.badge{display:inline-block;background:var(--accent-weak);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.form-grid{display:flex;flex-direction:column;gap:14px;max-width:460px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.field input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;font-family:inherit}
.switch-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer}
.switch-row input{width:20px;height:20px;accent-color:var(--accent)}
.ok-msg{color:var(--success);font-weight:700}
.chuleta-t3{background:var(--surface-2)!important;border:1px solid var(--border);border-radius:14px}
.chuleta-t3,.chuleta-t3 *{color:var(--text)!important}
.chuleta-t3 hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal p{margin:0 0 18px;font-weight:600}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
#themeToggle{position:fixed;bottom:18px;left:18px;width:52px;height:52px;border-radius:50%;font-size:22px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:9999;padding:0}
#signature{position:fixed;bottom:10px;right:14px;font-size:11px;color:var(--muted);opacity:.7;user-select:none}
@media (max-width:600px){
  .wrap{padding:10px}
  #menu{grid-template-columns:repeat(2,1fr)}
  .scoreboard{grid-template-columns:repeat(2,1fr)}
  #signature{display:none}
}
@media (max-width:380px){#menu{grid-template-columns:1fr}}
</style>
</head><body>

<script>
const questions=[{"q": "De entre los factores personales que afectan a los consumidores, 'individuos agrupados por comportamientos y valores semejantes en función de su riqueza'. ¿Con qué factor personal se corresponde?", "o": ["Rol y estatus", "Familia", "Creencias", "Clase social"], "a": 3},{"q": "De los 3 principios fundamentales del marketing, cuál se corresponde con la metodología utilizada, el uso de los recursos y la utilidad o eficacia.", "o": ["Principio de creación de valor para el cliente", "Principio de selectividad y concentración de consumidores", "Principio de ventaja diferencial", "Principio de creación del producto"], "a": 0},{"q": "El deporte como producto tiene unas características específicas. Selecciona de entre las siguientes la que no es correcta.", "o": ["Es atractivo", "Es imprevisible", "Es efímero", "Es tangible"], "a": 3},{"q": "En palabras coloquiales, Marketing es...", "o": ["Seducción y Fama", "Cálculo y aritmética", "Información y Riesgo", "Publicidad e inversión"], "a": 0},{"q": "La evolución del marketing estuvo marcada por etapas. ¿En qué etapa se inicia la rivalidad competitiva para vender productos?", "o": ["En la etapa de orientación hacia la organización", "En la etapa de orientación al mercado", "En la etapa de orientación hacia la publicidad", "En la etapa de orientación al producto"], "a": 0},{"q": "La persona que compra un producto o servicio es:", "o": ["Ninguna", "El consumidor", "El usuario", "El cliente"], "a": 1},{"q": "Las necesidades o motivos deportivos se clasifican principalmente en 5 tipos. ¿Qué ejemplo ilustra mejor una motivación holística?", "o": ["Salir a navegar en un velero para hacer fotos y vídeos que colgar en Instagram", "Acudir a un campo de golf a hacer un curso para obtener el handicap de golf", "Salir en bicicleta por una arboleda cercana buscando evadirse del mundanal ruido", "Ir a la bolera con un amigo"], "a": 2},{"q": "Según los tipos de mercado, denominamos a la suma de clientes de todos los ofertantes de una zona geográfica definida como:", "o": ["Mercado disponible total", "Mercado potencial total", "Mercado objetivo total", "Mercado penetrado total"], "a": 1},{"q": "Según los tipos de mercado, para un club de patinaje, los interesados en la práctica del patinaje son:", "o": ["Mercado potencial", "Mercado penetrado", "Mercado disponible", "Mercado objetivo"], "a": 2},{"q": "Señala la que no es correcta entre las siguientes diferencias entre el marketing y la venta.", "o": ["La venta se centra en el servicio deportivo y el marketing en los clientes", "La venta se orienta a la utilidad del servicio y el marketing al volumen de servicios realizados", "La venta da preferencia a las necesidades del vendedor y el marketing a los deseos del consumidor", "La venta se planifica a corto plazo y el marketing a largo plazo"], "a": 1},{"q": "¿A qué nivel de necesidad se corresponde 'ser respetado por los demás'?", "o": ["Necesidades de seguridad", "Necesidades de autorrealización", "Necesidades de autoestima", "Necesidades sociales"], "a": 2},{"q": "¿Cómo se denomina a los consumidores que no practican ni demandan un determinado servicio/producto deportivo de forma habitual, pero les gustaría?", "o": ["Demanda inestable", "Demanda ausente", "Demanda intermitente", "Demanda latente"], "a": 3},{"q": "¿En qué etapa afecta, principalmente, al consumidor la recepción de estímulos internos o externos?", "o": ["Búsqueda de información", "Valoración de alternativas y evaluación de preferencias", "Reconocimiento de la necesidad", "Decisión de compra"], "a": 2},{"q": "¿Qué tipos de Marketing podemos encontrar?", "o": ["De publicidad y de comunicación", "Captación y fidelización", "De clientes y de competidores", "Estratégico y operacional"], "a": 3},{"q": "Respecto al análisis de datos. ¿Cómo se interpretaría una desviación típica de valor 2,1 sobre una escala de 10 puntos?", "o": ["Baja", "Alta", "Muy alta", "Media"], "a": 3},{"q": "Respecto al análisis de datos ¿En qué tipo de variables podemos traducir el resultado de la media en el porcentaje de una respuesta?", "o": ["Nominales politómicas", "Ordinales", "Continuas", "Nominales dicotómicas"], "a": 3},{"q": "Respecto a las técnicas de investigación: ¿Cuántas personas suelen participar en una dinámica de grupo?", "o": ["Entre 6 y 10", "Entre 3 y 5", "Entre 10 y 20", "Mínimo 15"], "a": 0},{"q": "¿Qué tipo de variable es la respuesta a esta pregunta: '¿Cuánto estás dispuesto a gastarte como máximo en una hora de entrenador personal?'", "o": ["Discreta", "Cualitativa", "Ordinal", "Nominal"], "a": 0},{"q": "¿Qué es el Search Engine Marketing?", "o": ["Sistema de afiliación de usuarios basado en la criptografía y el lenguaje cifrado", "Estrategia de optimización de la visibilidad de un negocio en los resultados orgánicos de búsqueda local", "Un motor de búsqueda específico para generar campañas de captación y venta", "Herramienta que utiliza los motores de búsqueda para promocionar sitios"], "a": 3},{"q": "Según el siguiente ejemplo, ¿qué tipo de pregunta es esta? Ordena numerando según lo que consideres más importante: precio, instalaciones, atención, profesionales y formas de pago.", "o": ["De ranking", "Elección múltiple", "De batería", "De escala"], "a": 0},{"q": "Las encuestas de mercado que calculan el número de personas potenciales en función de sus características personales y elección de producto son:", "o": ["Las de tipo cuantitativo", "Las de tipo selectivo", "Las de tipo cualitativo", "Las de tipo colectivo"], "a": 0},{"q": "¿Qué tipo de variable es una valoración subjetiva de 0 a 10?", "o": ["Ordinal", "Continua", "Discreta", "Nominal"], "a": 0},{"q": "Si observamos las diferentes fases del ciclo de vida de un producto-servicio, aquella en la que el enfoque de la estrategia se centra en la captación de varios segmentos y en requerir una alta inversión en marketing corresponde a:", "o": ["La fase de crecimiento", "La fase de madurez", "La fase de introducción", "La fase de declive"], "a": 0},{"q": "Respecto a las técnicas de investigación: ¿Para qué se utilizan principalmente las dinámicas de grupo?", "o": ["Para conocer tendencias globales de opinión, comportamiento y características demográficas", "Para registrar las conductas de los clientes potenciales en su entorno directo", "Para dar apoyo al responsable en determinadas decisiones que afectan al servicio", "Para conocer los motivos por los que los clientes toman decisiones"], "a": 2},{"q": "¿Qué motivo suele generar un descenso de clientes por fallos en el servicio?", "o": ["La competencia barata", "Cambios en el mercado global", "Causas de la organización y su calidad de servicio", "Otras causas no nombradas"], "a": 2},{"q": "Los diferentes tipos de propuesta de valor que podemos encontrar son:", "o": ["Innovación, publicidad y liderazgo de mercado", "Localización, calidad y beneficios del producto", "Precio, calidad, servicio al cliente, experiencia cliente, seguridad y marca", "Imagen de marca, diversidad de servicios, disponibilidad limitada"], "a": 2},{"q": "¿Cuál es una característica esencial de los KPI?", "o": ["Relevancia directa con los objetivos de la organización", "Intentar abarcar al máximo número de clientes posibles", "Ignorar por completo la competencia en el mercado", "Ofrecer productos genéricos a precios bajos"], "a": 0},{"q": "¿Cuál de los siguientes ejemplos describe mejor el valor funcional según la Pirámide de Bain?", "o": ["Colorido y diseño llamativo", "Donación de un porcentaje de las ventas a organizaciones benéficas", "Publicidad que resalta la sensación de pertenencia al utilizar el producto", "Facilidad de uso y durabilidad del producto"], "a": 3},{"q": "A la hora de confeccionar un KPI, se debe tener en cuenta que este sea:", "o": ["Alcanzable, medible, cuantificable, exacto, periódico y relevante", "Ninguna de las anteriores", "Alcanzable, medible, cuantificable, exacto, flexible, periódico y relevante", "Alcanzable, medible, cuantificable, exacto, let pool=[],i=0,score=0,wrong=[],mode='practice',t0=0,timerInterval=null,timeLeft=1500,examAnswers=[],flagged=[];
const DEFAULT_SETTINGS={numQuestions:40,durationMin:25,pointsCorrect:1,penalize:true,pointsWrong:0.33,shuffleOptions:false};
let examSettings=Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem('md_examSettings')||'{}'));
function settingsView(){
 const s=examSettings;
 document.getElementById('app').innerHTML=`
 <h2>⚙️ Ajustes del examen</h2>
 <div class="form-grid">
   <div class="field"><label>Nº de preguntas (máx ${questions.length})</label><input id="set_num" type="number" min="1" max="${questions.length}" value="${s.numQuestions}"></div>
   <div class="field"><label>Duración (minutos)</label><input id="set_dur" type="number" min="1" value="${s.durationMin}"></div>
   <div class="field"><label>Puntos por acierto (suma)</label><input id="set_suma" type="number" min="0" step="0.01" value="${s.pointsCorrect}"></div>
   <div class="field"><label>Puntos por fallo (resta)</label><input id="set_resta" type="number" min="0" step="0.01" value="${s.pointsWrong}"></div>
   <label class="switch-row"><input id="set_penal" type="checkbox" ${s.penalize?'checked':''}> Penalizar fallos</label>
   <label class="switch-row"><input id="set_shuffle" type="checkbox" ${s.shuffleOptions?'checked':''}> Barajar el orden de las opciones</label>
 </div>
 <div id="set_msg"></div>
 <div class="actions">
   <button class="btn-primary" onclick="saveSettings()">💾 Guardar ajustes</button>
   <button class="btn-ghost" onclick="location.reload()">🏠 Volver</button>
 </div>`;
}
function saveSettings(){
 const n=parseInt(document.getElementById('set_num').value)||DEFAULT_SETTINGS.numQuestions;
 examSettings.numQuestions=Math.max(1,Math.min(n,questions.length));
 examSettings.durationMin=Math.max(1,parseInt(document.getElementById('set_dur').value)||DEFAULT_SETTINGS.durationMin);
 examSettings.pointsCorrect=Math.max(0,parseFloat(document.getElementById('set_suma').value)||0);
 examSettings.penalize=document.getElementById('set_penal').checked;
 examSettings.pointsWrong=Math.max(0,parseFloat(document.getElementById('set_resta').value)||0);
 examSettings.shuffleOptions=document.getElementById('set_shuffle').checked;
 localStorage.setItem('md_examSettings',JSON.stringify(examSettings));
 document.getElementById('set_msg').innerHTML='<p class="ok-msg">✅ Ajustes guardados</p>';
}
let stats=JSON.parse(localStorage.getItem('md_stats')||'{"ok":0,"bad":0}');
let bestScore=JSON.parse(localStorage.getItem('md_best')||'null');
let missStats=JSON.parse(localStorage.getItem('md_missStats')||'{}');
let examHistory=JSON.parse(localStorage.getItem('md_history')||'[]');
let historyStack=[];
function save(){
localStorage.setItem('md_stats',JSON.stringify(stats));
localStorage.setItem('md_missStats',JSON.stringify(missStats));
}
function uiConfirm(msg,onYes){
 const ov=document.createElement('div');
 ov.className='modal-overlay';
 ov.innerHTML=`<div class="modal"><p>${msg}</p><div class="modal-actions"><button class="btn-ghost">Cancelar</button><button class="btn-primary">Aceptar</button></div></div>`;
 const btns=ov.querySelectorAll('button');
 btns[0].onclick=()=>ov.remove();
 btns[1].onclick=()=>{ov.remove();onYes();};
 document.body.appendChild(ov);
}
function sh(a){return [...a].sort(()=>Math.random()-0.5)}
function progress(){return `<div class="bar"><div class="fill" style="width:${Math.round((i)/pool.length*100)}%"></div></div>`;}
function startPractice(){mode='practice';pool=sh(questions);i=0;historyStack=[];show();}
function startExam(){
mode='exam';
pool=buildExamPool();
i=0;score=0;wrong=[];historyStack=[];examAnswers=[];flagged=[];t0=Date.now();
timeLeft=examSettings.durationMin*60;
if(timerInterval) clearInterval(timerInterval);
timerInterval=setInterval(updateTimer,1000);
show();
}
function buildExamPool(){
 let sel=sh(questions).slice(0,Math.min(examSettings.numQuestions,questions.length));
 if(examSettings.shuffleOptions){
   sel=sel.map(q=>{
     if(q.type==='match'||!q.o) return q;
     const idx=q.o.map((_,k)=>k);
     const shuf=sh(idx);
     return Object.assign({},q,{o:shuf.map(k=>q.o[k]),a:shuf.indexOf(q.a)});
   });
 }
 return sel;
}
function show(){
 let q=pool[i];
 let h='';
 if(mode==='exam'){
   h+=examPalette();
   const m=Math.floor(timeLeft/60), s=timeLeft%60;
   const dz=timeLeft<=60?' danger':'';
   h+=`<div class="q-meta"><span class="q-count">Pregunta ${i+1}/${pool.length}</span><span id="timer" class="timer${dz}">⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span></div>`;
 }else{
   h+=`<div class="q-count">Pregunta ${i+1}/${pool.length}</div>`;
 }
 h+=progress();
 if(q.img) h+=`<img src="${q.img}" alt="">`;
 h+=`<div class="question">${q.q}</div>`;
 if(q.type==="match"){
   const stored=(mode==='exam'&&Array.isArray(examAnswers[i]))?examAnswers[i]:null;
   q.items.forEach((it,idx)=>{
     const selv=stored?stored[idx]:undefined;
     h+=`<div class="match-row"><div>${it}</div><select id="m_${idx}" ${mode==='exam'?'onchange="storeMatch()"':''}><option value="">Selecciona...</option>${q.options.map((op,oi)=>`<option value="${oi}" ${selv===oi?'selected':''}>${op}</option>`).join("")}</select></div>`;
   });
   if(mode!=='exam') h+=`<button class="opt" onclick="answerMatch()">Comprobar</button>`;
 }else{
   q.o.forEach((o,n)=>{
     const chosen=(mode==='exam'&&examAnswers[i]===n)?' selected':'';
     h+=`<button class="opt${chosen}" onclick="answer(${n})">${o}</button>`;
   });
 }
 if(mode==='exam') h+=examNav();
 document.getElementById('app').innerHTML=h;
}
function examPalette(){
 let cells=pool.map((q,n)=>{
   const ans=examAnswers[n];
   const answered=(q.type==='match')?(Array.isArray(ans)&&ans.some(v=>v!==undefined)):(ans!==undefined&&ans!==null);
   let cls='cell';
   if(answered) cls+=' answered';
   if(flagged[n]) cls+=' flagged';
   if(n===i) cls+=' current';
   return `<button class="${cls}" onclick="goTo(${n})">${n+1}</button>`;
 }).join('');
 return `<div class="palette">${cells}</div><div class="legend"><span>🟩 Respondida</span><span>🟧 Marcada</span><span>⬜ En blanco</span></div>`;
}
function examNav(){
 const fl=flagged[i]?'🚩 Quitar marca':'🏳️ Marcar para revisar';
 return `<div class="actions">
   <button class="btn-ghost" onclick="prevQ()" ${i===0?'disabled':''}>⬅️ Anterior</button>
   <button class="btn-ghost" onclick="nextQ()" ${i>=pool.length-1?'disabled':''}>Siguiente ➡️</button>
   <button class="btn-ghost" onclick="skipQ()">⏭️ Omitir</button>
   <button class="btn-ghost" onclick="toggleFlag()">${fl}</button>
   <button class="btn-success" onclick="finishNow()">✅ Corregir ahora</button>
 </div>`;
}
function storeMatch(){
 let q=pool[i],arr=[];
 for(let x=0;x<q.answers.length;x++){let v=document.getElementById("m_"+x).value;arr[x]=v===''?undefined:parseInt(v);}
 examAnswers[i]=arr;
 // refresh palette state without losing select focus is fine on next nav
}
function answerMatch(){
 let q=pool[i],ok=true;
 for(let x=0;x<q.answers.length;x++){
   let s=document.getElementById("m_"+x);
   let v=parseInt(s.value);
   let correct=(v===q.answers[x]);
   if(!correct) ok=false;
   s.disabled=true;
   s.classList.add(correct?'sel-ok':'sel-bad');
 }
 if(ok) stats.ok++; else {stats.bad++; missStats[q.q]=(missStats[q.q]||0)+1;}
 save();
 document.getElementById('app').innerHTML += `<div class="actions"><button class="btn-ghost" onclick="prevQ()">⬅️ Anterior</button><button class="btn-primary" onclick="nextQ()">Siguiente ➡️</button></div>`;
}
function answer(n){
 let q=pool[i];
 if(mode==='exam'){
   examAnswers[i]=(examAnswers[i]===n)?undefined:n;
   show();
   return;
 }
 const botones=document.querySelectorAll('.opt');
 botones.forEach((btn,index)=>{
   btn.disabled=true;
   if(index===q.a) btn.classList.add('correct');
   if(index===n && index!==q.a) btn.classList.add('wrong');
 });
 if(n===q.a){stats.ok++; if(mode==='hard'){delete missStats[q.q];}}
 else{stats.bad++; missStats[q.q]=(missStats[q.q]||0)+1;}
 save();
 document.getElementById('app').innerHTML += `<div class="actions"><button class="btn-ghost" onclick="prevQ()" ${historyStack.length?'':'disabled'}>⬅️ Anterior</button><button class="btn-primary" onclick="nextQ()">Siguiente ➡️</button></div>`;
}
function nextQ(){
 if(mode==='exam'){ if(i<pool.length-1){i++;show();} return; }
 historyStack.push(i);
 i++;
 if(i>=pool.length){
   if(mode==='hard'){
     document.getElementById('app').innerHTML='<h2>🔥 Repaso completado</h2><p>Preguntas pendientes: '+Object.keys(missStats).length+'</p><button onclick="startHardMode()">🔥 Más falladas</button><button onclick="location.reload()">🏠 Inicio</button>';
     save();
     return;
   }
   pool=sh(questions);i=0;
 }
 show();
}
function prevQ(){
 if(mode==='exam'){ if(i>0){i--;show();} return; }
 if(!historyStack.length) return;
 i=historyStack.pop();
 show();
}
function goTo(n){ if(n>=0&&n<pool.length){i=n;show();} }
function skipQ(){ examAnswers[i]=undefined; if(i<pool.length-1){i++;} show(); }
function toggleFlag(){ flagged[i]=!flagged[i]; show(); }
function finishNow(){
 let blancos=0;
 for(let k=0;k<pool.length;k++){
   const q=pool[k],a=examAnswers[k];
   const answered=(q.type==='match')?(Array.isArray(a)&&a.some(v=>v!==undefined)):(a!==undefined&&a!==null);
   if(!answered) blancos++;
 }
 if(blancos>0){ uiConfirm('Te quedan '+blancos+' pregunta(s) en blanco. ¿Corregir igualmente?',finishExam); }
 else finishExam();
}
function retryWrong(){ if(!wrong.length)return; pool=wrong;i=0;mode='practice';show(); }


function updateTimer(){
  timeLeft--;
  const el=document.getElementById('timer');
  if(el){
    const m=Math.floor(timeLeft/60), s=timeLeft%60;
    el.textContent='⏱️ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    el.style.color=timeLeft<=60?'#e53935':'';
  }
  if(timeLeft<=0){
    clearInterval(timerInterval);
    finishExam();
  }
}

function finishExam(){
 if(timerInterval) clearInterval(timerInterval);
 const s=examSettings;
 let aciertos=0, fallos=0, blancos=0;
 for(let k=0;k<pool.length;k++){
   let q=pool[k], r=examAnswers[k];
   const answered=(q.type==='match')?(Array.isArray(r)&&r.some(v=>v!==undefined)):(r!==undefined&&r!==null);
   let ok=(q.type==='match')?(JSON.stringify(r)===JSON.stringify(q.answers)):(r===q.a);
   if(!answered){ blancos++; }
   else if(ok){ aciertos++; }
   else{ fallos++; }
 }
 let penal=s.penalize?fallos*s.pointsWrong:0;
 let maxPuntos=pool.length*s.pointsCorrect;
 let puntos=Math.max(0,aciertos*s.pointsCorrect-penal);
 let nota=maxPuntos?((puntos/maxPuntos)*10).toFixed(2):'0.00';
 let wrongReview=[];
 for(let k=0;k<pool.length;k++){
   let q=pool[k], r=examAnswers[k];
   const answered=(q.type==='match')?(Array.isArray(r)&&r.some(v=>v!==undefined)):(r!==undefined&&r!==null);
   let ok=(q.type==='match')?(JSON.stringify(r)===JSON.stringify(q.answers)):(r===q.a);
   if(!ok && q.o){
     wrongReview.push({q:q.q,user:(answered&&q.o[r]!==undefined)?q.o[r]:'Sin responder',correct:q.o[q.a]});
   }
 }
 window.lastWrongReview=wrongReview;
 let cara=nota>=5?'😊':'☹️';
 let msg=nota>=5?'ENHORABUENA, HAS APROBADO':'ESPABILA CHAVAL...';
 let usados=s.durationMin*60-Math.max(0,timeLeft);
 let tiempo=String(Math.floor(usados/60)).padStart(2,'0')+':'+String(usados%60).padStart(2,'0');
 if(!bestScore || Number(nota)>Number(bestScore.score)){
   bestScore={score:Number(nota),total:10,pct:Math.round(Number(nota)*10),date:new Date().toLocaleString('es-ES')};
   localStorage.setItem('md_best',JSON.stringify(bestScore));
 }
 const examEntry={score:Number(nota),total:10,pct:Math.round(Number(nota)*10),aciertos,fallos,blancos,preguntas:pool.length,tiempo,date:new Date().toLocaleString('es-ES')};
 examHistory.unshift(examEntry);
 examHistory=examHistory.slice(0,10);
 localStorage.setItem('md_history',JSON.stringify(examHistory));
 document.getElementById('app').innerHTML=`
 <div class="result"><p class="emoji">${cara}</p><h2>${msg}</h2><p class="score">${nota}/10</p></div>
 <div class="scoreboard">
   <div class="stat"><span class="n">${aciertos}</span><span class="l">✅ Aciertos</span></div>
   <div class="stat"><span class="n">${fallos}</span><span class="l">❌ Fallos</span></div>
   <div class="stat"><span class="n">${blancos}</span><span class="l">⬜ En blanco</span></div>
   <div class="stat"><span class="n">-${penal.toFixed(2)}</span><span class="l">➖ Penalización</span></div>
   <div class="stat"><span class="n">${tiempo}</span><span class="l">⏱️ Tiempo</span></div>
 </div>
 <div class="actions"><button class="btn-primary" onclick="showWrongAnswers()">📖 Ver falladas</button><button class="btn-ghost" onclick="location.reload()">🏠 Inicio</button></div>`;
}
function showWrongAnswers(){
 const data=window.lastWrongReview||[];
 if(!data.length){
   document.getElementById('app').innerHTML='<h2>✅ No has fallado ninguna pregunta</h2><div class="actions"><button class="btn-primary" onclick="location.reload()">🏠 Inicio</button></div>';
   return;
 }
 document.getElementById('app').innerHTML='<h2>📖 Respuestas falladas</h2>'+data.map((x,n)=>`<div class="review-item"><b>${n+1}. ${x.q}</b><span class="user-ans">Tu respuesta: ${x.user}</span><br><span class="correct-ans">Correcta: ${x.correct}</span></div>`).join('')+'<div class="actions"><button class="btn-primary" onclick="location.reload()">🏠 Inicio</button></div>';
}
function startHardMode(){
 const hardQuestions=[...new Map(questions.filter(q=>missStats[q.q]).map(q=>[q.q,q])).values()];
 if(!hardQuestions.length){
   document.getElementById('app').innerHTML='<h2>🔥 Más falladas</h2><p>Todavía no has fallado ninguna pregunta.</p><button onclick="location.reload()">🏠 Inicio</button>';
   return;
 }
 mode='hard';
 pool=hardQuestions;
 i=0;
 historyStack=[];
 show();
}

<h2>📚 Chuleta rápida para el examen</h2>

<h3>💰 INGRESOS</h3>
<p><b>Fórmula:</b> Ingresos = Precio × Clientes</p>
<p><b>Ejemplo:</b> 40€ × 155 = 6.200€</p>
<p>✅ Resultado: 6.200€</p><hr>

<h3>💸 GASTOS TOTALES</h3>
<p><b>Fórmula:</b> Gastos Totales = Personal + Generales + Suministros + Financiación</p>
<p><b>Ejemplo:</b> 14.700 + 5.679 + 3.708 + 600 = 24.687€</p>
<p>✅ Resultado: 24.687€</p><hr>

<h3>👤 COSTE UNITARIO</h3>
<p><b>Fórmula:</b> Coste Unitario = Gastos Totales ÷ Clientes</p>
<p><b>Ejemplo:</b> 24.687 ÷ 775 = 31,85€</p>
<p>✅ Resultado: 31,85€</p><hr>

<h3>⚖️ PUNTO DE EQUILIBRIO</h3>
<p><b>Fórmula:</b> Punto de Equilibrio = Gastos Totales ÷ Precio</p>
<p><b>Ejemplo:</b> 25.960 ÷ 25 = 1.038,4 clientes</p>
<p>✅ Resultado: 1.038,4 clientes</p><hr>

<h3>🎯 PRECIO PARA CUBRIR COSTES</h3>
<p><b>Fórmula:</b> Precio = Gastos Totales ÷ Clientes</p>
<p>⚠️ Igual que el Coste Unitario.</p>
<p><b>Ejemplo:</b> 26.006 ÷ 945 = 27,52€</p>
<p>✅ Resultado: 27,52€</p><hr>

<h3>📈 BENEFICIO DEL 25%</h3>

<p>✅ Resultado: 28,91€</p><hr>

<h3>🚀 BENEFICIO DEL 40%</h3>
<p><b>Fórmula:</b> Precio = Coste Unitario × 1,40</p>
<p><b>Ejemplo:</b> 19,23 × 1,40 = 26,92€</p>
<p>✅ Resultado: 26,92€</p><hr>

<h3>🧾 IVA (21%)</h3>
<p><b>Añadir IVA:</b> Precio × 1,21</p>

<p>✅ Resultado: 38,54€</p><hr>

<h3>🔄 QUITAR IVA</h3>

<p>✅ Resultado: 31,85€</p><hr>

<h3>📉 CHURN RATE</h3>

<h2>📚 Chuleta rápida para el examen</h2>

<h3>💰 INGRESOS</h3>
<p><b>Fórmula:</b> Ingresos = Precio × Clientes</p>
<p><b>Ejemplo:</b> 40€ × 155 = 6.200€</p>
<p>✅ Resultado: 6.200€</p><hr>

<h3>💸 GASTOS TOTALES</h3>
<p><b>Fórmula:</b> Gastos Totales = Personal + Generales + Suministros + Financiación</p>
<p><b>Ejemplo:</b> 14.700 + 5.679 + 3.708 + 600 = 24.687€</p>
<p>✅ Resultado: 24.687€</p><hr>

<h3>👤 COSTE UNITARIO</h3>
<p><b>Fórmula:</b> Coste Unitario = Gastos Totales ÷ Clientes</p>
<p><b>Ejemplo:</b> 24.687 ÷ 775 = 31,85€</p>
<p>✅ Resultado: 31,85€</p><hr>

<h3>⚖️ PUNTO DE EQUILIBRIO</h3>
<p><b>Fórmula:</b> Punto de Equilibrio = Gastos Totales ÷ Precio</p>
<p><b>Ejemplo:</b> 25.960 ÷ 25 = 1.038,4 clientes</p>
<p>✅ Resultado: 1.038,4 clientes</p><hr>

<h3>🎯 PRECIO PARA CUBRIR COSTES</h3>
<p><b>Fórmula:</b> Precio = Gastos Totales ÷ Clientes</p>
<p>⚠️ Igual que el Coste Unitario.</p>
<p><b>Ejemplo:</b> 26.006 ÷ 945 = 27,52€</p>
<p>✅ Resultado: 27,52€</p><hr>

<h3>📈 BENEFICIO DEL 25%</h3>

<p>✅ Resultado: 28,91€</p><hr>

<h3>🚀 BENEFICIO DEL 40%</h3>
<p><b>Fórmula:</b> Precio = Coste Unitario × 1,40</p>
<p><b>Ejemplo:</b> 19,23 × 1,40 = 26,92€</p>
<p>✅ Resultado: 26,92€</p><hr>

<h3>🧾 IVA (21%)</h3>
<p><b>Añadir IVA:</b> Precio × 1,21</p>

<p>✅ Resultado: 38,54€</p><hr>

<h3>🔄 QUITAR IVA</h3>

<p>✅ Resultado: 31,85€</p><hr>

<h3>📉 CHURN RATE</h3>
